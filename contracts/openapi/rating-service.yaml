openapi: 3.1.0
info:
  title: ShareConnectSave — Rating Service
  version: "1.0.0"
  description: >
    Rating submission and trust score calculation. JWT validated at API
    Gateway (YARP). Services receive X-User-Id (uuid), X-User-Role
    (user|admin), X-User-Gender (female|male|unspecified) headers. Never
    re-validate the JWT.

tags:
  - name: ratings

paths:
  /ratings:
    post:
      tags: [ratings]
      summary: Submit a rating for a completed connection
      description: >
        Mandatory on the Met-Successfully path, optional on the timeout
        path (REQUIREMENTS.md §7). On success, writes an outbox record for
        `rating.submitted` in the same transaction (Outbox Pattern) — trust
        score recalculation happens asynchronously off that event, not
        inline in this request, so this endpoint stays fast regardless of
        how expensive score recalculation gets.
      operationId: submitRating
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingSubmitRequest'
      responses:
        '201':
          description: Rating recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller was not a participant in the referenced connection.
          content:
            application/json:
              schema:
                $ref: './error-envelope.yaml#/components/schemas/ErrorResponse'
        '409':
          description: Caller already rated this connection.
          content:
            application/json:
              schema:
                $ref: './error-envelope.yaml#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /ratings/trust-score:
    get:
      tags: [ratings]
      summary: Get the caller's own trust score
      operationId: getOwnTrustScore
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Trust score returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustScoreResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /ratings/trust-score/{userId}:
    get:
      tags: [ratings]
      summary: Get any user's trust score (admin only)
      operationId: getTrustScoreForUser
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trust score returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustScoreResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: './error-envelope.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: Injected by the API Gateway after JWT validation.
      schema:
        type: string
        format: uuid
    XUserRole:
      name: X-User-Role
      in: header
      required: true
      schema:
        type: string
        enum: [user, admin]

  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: './error-envelope.yaml#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid identity headers.
      content:
        application/json:
          schema:
            $ref: './error-envelope.yaml#/components/schemas/ErrorResponse'
    NotFound:
      description: User not found.
      content:
        application/json:
          schema:
            $ref: './error-envelope.yaml#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: './error-envelope.yaml#/components/schemas/ErrorResponse'

  schemas:
    # Open/Closed Principle: RatingTag is a plain enum/config list. Adding a
    # new tag (e.g. "Great conversation") means extending this enum — no
    # change to the validation logic that checks a submitted tag is a member
    # of it. See REQUIREMENTS.md §7 for the canonical tag list.
    RatingTag:
      type: string
      enum:
        - Friendly
        - Respectful
        - On time
        - Good communication
        - Would travel again
        - Didn't show up
        - Fake destination
        - Abusive
        - Spam
        - Asked for money

    RatingSubmitRequest:
      type: object
      required: [connection_id, rated_id, tags]
      properties:
        connection_id:
          type: string
          format: uuid
        rated_id:
          type: string
          format: uuid
        tags:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RatingTag'
        comment:
          type: ["string", "null"]
          maxLength: 500

    Rating:
      type: object
      required: [id, connection_id, rater_id, rated_id, tags, created_at]
      properties:
        id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        rater_id:
          type: string
          format: uuid
        rated_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            $ref: '#/components/schemas/RatingTag'
        comment:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    TrustScoreResponse:
      type: object
      required: [user_id, score, badge_level, request_limit, suspended]
      properties:
        user_id:
          type: string
          format: uuid
        score:
          type: number
        badge_level:
          type: string
          enum: [none, trusted]
        request_limit:
          type: integer
          description: Max connection requests the user may send per window; throttled down after repeated negative ratings.
        suspended:
          type: boolean
          description: True when score is very low or abuse-report threshold hit — queued for manual admin review.
