<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Karwan app icon source: the Devanagari क as a bold monogram, Baloo 2,
       with the same ochre seam-slash used on the full wordmark. One glyph
       reads at every size this file gets scaled to (favicon through
       512x512), where a multi-element scene would go flat or muddy. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97A3F"/>
      <stop offset="100%" stop-color="#E8B45C"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#tile)"/>
  <text x="44" y="76" text-anchor="middle" font-family="'Baloo 2','Rajdhani',sans-serif" font-weight="800" font-size="84" fill="#F4E9D8">क</text>
  <rect x="12" y="54" width="54" height="12" rx="6" fill="#0E1527" transform="rotate(-27 39 60)"/>
</svg>
