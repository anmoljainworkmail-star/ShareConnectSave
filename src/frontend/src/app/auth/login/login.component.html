<div class="auth-page">
  <!-- Shared background decoration (SharedModule) -- the atlas map every
       screen sits on. See AmbientBackgroundComponent's header comment. -->
  <app-ambient-background></app-ambient-background>

  <!-- Hero lives OUTSIDE the card, directly on the map: the background is the
       first impression, so the brand + headline are drawn over it and the
       card shrinks to just the one action (sign in). -->
  <header class="auth-hero">
    <div class="auth-brand">
      <!-- क is the first consonant of Devanagari and the first sound of
           कारवां (caravan) -- a single-glyph monogram instead of the old
           radar-target icon, see login.component.css's :host block for why
           this tile breaks from the app's violet system. -->
      <svg class="auth-logo" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <text x="44" y="76" text-anchor="middle" class="auth-logo-glyph">क</text>
        <rect x="12" y="54" width="54" height="12" rx="6" transform="rotate(-27 39 60)" class="auth-logo-slash"></rect>
      </svg>
      <span class="auth-wordmark"><span class="auth-wordmark-deva">कार</span><span class="auth-wordmark-lat">wan</span></span>
    </div>

    <h1 class="auth-heading">Never travel alone.</h1>
    <p class="auth-subtext">Verified travelers, heading your way.</p>
  </header>

  <main class="auth-card">
    <div #googleButton class="google-button-slot"></div>

    <p *ngIf="isSubmitting" class="auth-status" role="status">Signing you in&hellip;</p>
    <p *ngIf="errorMessage" class="auth-error" role="alert">{{ errorMessage }}</p>

    <p class="auth-fine-print">By continuing you agree to our Terms and Privacy Policy.</p>
  </main>
</div>
