<!--
  Purely visual, never interactive -- aria-hidden here plus `pointer-events:
  none` on :host (ambient-background.component.css) means none of this can
  ever steal a click, a hover state, or a screen-reader announcement from the
  real screen content stacked on top of it.

  This is the finalized "classic atlas map" background (approved design:
  https://claude.ai/artifact/Fa8U6UyKV2daPnf18c93NV, "Option 2") -- a static,
  hand-placed illustrated scene (3 landmasses, 1 route, a handful of
  stickers), not a generated field -- an atlas is a specific illustration,
  not a repeating pattern, so there's nothing here for *ngFor to usefully
  loop over, unlike the star field this replaces.
-->

<!-- Full-bleed fill layer, BEHIND the capped hero scene below -- the hero
     scene is intentionally capped to a sane max size (ambient-background.
     component.css's .ambient-decor comment explains why: uncapped, it blew
     up to an oversized, soft-looking mess on a wide desktop window). That
     cap is correct for the illustration itself, but on a wide window it
     leaves the margins around it as flat, empty ocean gradient -- "sharp in
     the middle, raw and empty everywhere else." This layer only adds things
     cheap enough to safely span the WHOLE page: a graticule grid, a sparse
     twinkling star field, and two small, deliberately DISTANT islands
     positioned a fixed pixel distance from true center (not a percentage) --
     see .distant-island's own CSS comment for why that specific trick is
     what makes them appear only once the window is actually wide, never on
     a phone-width viewport. -->

  <div class="graticule"></div>

  <span class="sky-star" style="top: 6%; left: 8%; animation-delay: 0s;"></span>
