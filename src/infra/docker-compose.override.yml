# docker-compose.override.yml — Dev-only overrides.
# Docker Compose automatically merges this with docker-compose.yml when running locally.
# Pattern: Environment-specific config without modifying the base file.
# In production CI, only docker-compose.yml is used; dev adds this layer on top.
# No top-level `version:` key — deprecated in Compose v2.

services:

  api-gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # DI pattern: gateway reads JWT_SECRET from env, never hardcoded
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set — copy .env.example to .env and fill in values}
    volumes:
      - ../services/api-gateway:/app/src

  user-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Database per Service: user-service has its own connection string
      # :? syntax — Docker Compose exits with an error if USER_DB_CONNECTION is not set.
      # This prevents silent use of a hardcoded credential; the developer must supply a real value via .env.
      - ConnectionStrings__UserDb=${USER_DB_CONNECTION:?USER_DB_CONNECTION must be set — copy .env.example to .env and fill in values}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # T016: RS256 private key material for user-service's own JWT issuance.
      # Defaults to empty — JwtIssuer falls back to an ephemeral in-memory
      # keypair when this is unset (see JwtIssuer.cs and .env.example). Never
      # required for local dev to boot; only set this for anything that must
      # survive a container restart.
      - Jwt__RsaPrivateKeyPem=${JWT__RSAPRIVATEKEYPEM:-}
      # Fix (found during full-stack integration testing, not caught by any
      # per-ticket QA pass — those all ran user-service via `dotnet run` with
      # these exported by hand, never through this compose file):
      # TwilioClient.cs reads these three directly and throws at first use if
      # any are missing — without this passthrough, POST /auth/otp/send 500s
      # the instant it's called through the container, even though a real
      # value exists in .env.
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      # Fix (found during integration testing — see .env.example's matching
      # comment): Twilio trial accounts reject free-form SMS to +91 numbers
      # outright (error 572006, an India TRAI/DLT compliance restriction).
      # Defaults to true here, same as IDENTITY_VERIFY_STUB below, so local
      # dev never depends on a live, regulation-constrained SMS carrier.
      - TWILIO_STUB=${TWILIO_STUB:-true}
      # T019: Program.cs reads IDENTITY_VERIFY_STUB at STARTUP (not lazily) to
      # decide which IFaceMatchService gets registered — without this
      # passthrough it always reads as unset/false inside the container,
      # silently wiring in the real Azure-backed implementation regardless of
      # what .env says, and POST /users/me/verify-identity would then fail on
      # missing AzureFace__Endpoint/Key instead of running in stub mode.
      # Defaults to true here specifically (unlike the empty defaults above)
      # because stub mode is the correct default for local dev/CI per
      # .env.example's own guidance.
      - IDENTITY_VERIFY_STUB=${IDENTITY_VERIFY_STUB:-true}
      - AzureFace__Endpoint=${AzureFace__Endpoint:-}
      - AzureFace__Key=${AzureFace__Key:-}
      # T049 (fix cycle 2): Shared secret for internal-only endpoints accessed
      # by other services. GET /users/internal/{id}/fcm-token requires this
      # header (X-Internal-Service-Key) to guard against misconfigured routing
      # that might expose it through the API gateway. Defaults to
      # "dev-internal-key-123" for local dev (see .env.example) — in production,
      # this must be a strong, randomly-generated value set via env vars.
      - InternalServiceKey=${INTERNAL_SERVICE_KEY:-dev-internal-key-123}

  discovery-service:
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${DISCOVERY_DB_URL:-jdbc:sqlserver://sqlserver:1433;databaseName=DiscoveryServiceDb;encrypt=true;trustServerCertificate=true}
      # Bug fix (T028): application.yml only declares dev/prod profile documents,
      # not docker — so activating SPRING_PROFILES_ACTIVE=docker skips the
      # spring.datasource.username/password ${DISCOVERY_DB_USERNAME}/${DISCOVERY_DB_PASSWORD}
      # placeholders in both of those blocks entirely. Spring Boot's DataSource
      # autoconfig then connects with an EMPTY username (SQL Server error 18456,
      # "Login failed for user ''"), not a missing-property failure, so this went
      # unnoticed until this service was the first one actually run in a
      # container. Setting these two directly as OS env vars works regardless of
      # active profile — same relaxed-binding mechanism SPRING_DATASOURCE_URL
      # above already relies on — and reuses the same SA_PASSWORD the sqlserver
      # service itself requires, rather than inventing a second credential.
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=${SA_PASSWORD:?SA_PASSWORD must be set — copy .env.example to .env and fill in values}
      # Fix (T025 known follow-up #3): kafka:9092 is the PLAINTEXT listener,
      # published to the HOST for tools like a developer's own CLI — it is
      # NOT reachable from container-to-container traffic on this Docker
      # network the way it might appear to be. discovery-service's Kafka
      # consumers run INSIDE the compose network, same as user-service (see
      # that service's own KAFKA_BOOTSTRAP entry, fixed under T020), so the
      # correct default here is the INTERNAL listener, kafka:29092.
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP:-kafka:29092}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      # Fix (found while preparing Discovery Service manual testing, same class
      # of gap as the two fixes above): application.yml's ble.seed.hmac-secret
      # (`${BLE_TOKEN_HMAC_SECRET}`, no default) lives in the file's SHARED
      # section, not inside the dev/prod profile documents skipped by
      # SPRING_PROFILES_ACTIVE=docker — so it is resolved at startup
      # regardless of profile, and was never being forwarded into this
      # container at all. Without this line, discovery-service fails to boot
      # in Docker with "Could not resolve placeholder 'BLE_TOKEN_HMAC_SECRET'"
      # every time, which went unnoticed until someone actually tried to bring
      # this service up via `docker compose up`. BleProperties.Seed's own
      # comment already explains this value is unused by the v2 resolve-side
      # math (the per-user SEED is the real signing key) — it still must be a
      # real, non-empty value, same :? required-with-message style as
      # SA_PASSWORD/JWT_SECRET above, not a blank default.
      - BLE_TOKEN_HMAC_SECRET=${BLE_TOKEN_HMAC_SECRET:?BLE_TOKEN_HMAC_SECRET must be set — copy .env.example to .env and fill in values}
      # Testing convenience only, not a prod concern: application.yml's real
      # default is 30s (discovery.cache.session-location-ttl-seconds, see that
      # file's own comment on why — a live GPS fix must expire fast, Location
      # Privacy). 30s is too short to manually re-hit /scan/update-location
      # from Postman between other checks, so this lets a developer raise it
      # locally via .env without touching the tracked default. Unset in .env
      # (or delete this override) to go back to the real 30s behavior.
      - DISCOVERY_SESSION_LOCATION_TTL_SECONDS=${DISCOVERY_SESSION_LOCATION_TTL_SECONDS:-30}

  connection-service:
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${CONNECTION_DB_URL:-jdbc:sqlserver://sqlserver:1433;databaseName=ConnectionServiceDb;encrypt=true;trustServerCertificate=true}
      # Bug fix (same class as T028's fix for discovery-service, see that
      # block's comment above): application.yml only declares dev/prod
      # profile documents, not docker, so SPRING_PROFILES_ACTIVE=docker skips
      # the spring.datasource.username/password placeholders entirely and
      # Spring Boot connects with an EMPTY username (SQL error 18456). Setting
      # these directly as OS env vars works regardless of active profile and
      # reuses the same SA_PASSWORD the sqlserver service itself requires.
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=${SA_PASSWORD:?SA_PASSWORD must be set — copy .env.example to .env and fill in values}
      # Fix (same class as T025's fix for discovery-service): kafka:9092 is
      # the PLAINTEXT listener published to the HOST, not reachable from
      # container-to-container traffic. connection-service's Kafka consumers
      # (TrustScoreUpdatedConsumer, outbox relay) run INSIDE the compose
      # network, so the correct default is the internal listener, kafka:29092.
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP:-kafka:29092}

  chat-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ChatDb=${CHAT_DB_CONNECTION:-mongodb://mongodb:27017/ChatServiceDb}
      - SIGNALR_REDIS_CONNECTION=${REDIS_CONNECTION:-redis:6379}
      # Fix (T039, same class as T025/T028's fix for discovery-service and
      # T020's fix for user-service): kafka:9092 is the PLAINTEXT listener
      # published to the HOST, not reachable from container-to-container
      # traffic — a client inside the compose network bootstraps against it
      # successfully, but Kafka's metadata response then redirects it to
      # "localhost:9092", which inside this container resolves to itself,
      # not the broker. chat-service's ConnectionAcceptedConsumer (T038) and
      # OutboxRelayHostedService (T039) both run inside the compose network,
      # so the correct default is the internal listener, kafka:29092.
      - KAFKA_BOOTSTRAP=${KAFKA_BOOTSTRAP:-kafka:29092}
      # T035 fix: without this, the `mongodb` container (which already reads
      # MONGO_TTL_SECONDS for its own init-script TTL index, see this file's
      # mongodb service above) and chat-service's own
      # MongoIndexInitializer would silently disagree whenever a developer
      # overrides MONGO_TTL_SECONDS in .env - the init script would use the
      # override, chat-service would fall back to its 7200s default, and
      # MongoIndexInitializer's drop+recreate guard would fight the init
      # script's index on every restart. Same variable, same default,
      # passed to both containers so there is exactly one value in play.
      - MONGO_TTL_SECONDS=${MONGO_TTL_SECONDS:-7200}
      # T037 additions - No Hardcoded Config: the grace period, poll
      # interval, and auto-close threshold are all business rules (how long
      # a traveler has before the platform's involvement truly ends), not
      # bare magic-number literals baked into ChatLifecycleService /
      # ChatAutoCloseHostedService. Same ${VAR:-default} idiom as every
      # other env var in this file; each default matches the ticket's spec
      # (5-minute grace, 5-minute poll, 2-hour open-room threshold).
      - CHAT_MET_GRACE_PERIOD_SECONDS=${CHAT_MET_GRACE_PERIOD_SECONDS:-300}
      - CHAT_AUTO_CLOSE_POLL_INTERVAL_SECONDS=${CHAT_AUTO_CLOSE_POLL_INTERVAL_SECONDS:-300}
      - CHAT_AUTO_CLOSE_THRESHOLD_HOURS=${CHAT_AUTO_CLOSE_THRESHOLD_HOURS:-2}
      # T039 addition - No Hardcoded Config: OutboxRelayHostedService's poll
      # cadence for relaying chat.closed events from the Mongo-native outbox
      # fields to Kafka. 500ms default matches connection-service's Java
      # OutboxRelay cadence (@Scheduled(fixedDelay = 500)), kept configurable
      # here per this service's own established per-timing-value env var
      # convention (see the T037 additions above).
      - CHAT_OUTBOX_RELAY_POLL_INTERVAL_MS=${CHAT_OUTBOX_RELAY_POLL_INTERVAL_MS:-500}

  rating-service:
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${RATING_DB_URL:-jdbc:sqlserver://sqlserver:1433;databaseName=RatingServiceDb;encrypt=true;trustServerCertificate=true}
      # Bug fix (T046, same class as T028's fix for discovery-service and
      # T034's fix for connection-service, see those blocks' comments above):
      # application.yml only declares dev/prod profile documents, not docker —
      # so activating SPRING_PROFILES_ACTIVE=docker skips the
      # spring.datasource.username/password ${RATING_DB_USERNAME}/
      # ${RATING_DB_PASSWORD} placeholders in both of those profile blocks
      # entirely. Spring Boot's DataSource autoconfig then connects with an
      # EMPTY username (SQL Server error 18456, "Login failed for user ''"),
      # not a missing-property failure — exactly the bug T028/T034 already
      # hit and fixed, caught here proactively before rating-service is ever
      # run in a container. Setting these two directly as OS env vars works
      # regardless of active profile (Spring's relaxed env-var binding, same
      # mechanism SPRING_DATASOURCE_URL above already relies on), and reuses
      # the same SA_PASSWORD the sqlserver service itself requires, rather
      # than inventing a second credential.
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=${SA_PASSWORD:?SA_PASSWORD must be set — copy .env.example to .env and fill in values}
      # Fix (same class as T025/T038's fix for discovery-service/chat-service,
      # applied here before it was ever caught live): kafka:9092 is the
      # PLAINTEXT listener, published to the HOST for tools like a developer's
      # own CLI — it is NOT reachable the way it looks from container-to-
      # container traffic on this Docker network. rating-service's own Kafka
      # consumers (ChatClosedConsumer, RatingSubmittedConsumer,
      # ReportFiledConsumer, T044) and Actuator's Kafka health indicator both
      # run INSIDE the compose network, so the correct default is the
      # INTERNAL listener, kafka:29092 — see the kafka service's own
      # KAFKA_CFG_ADVERTISED_LISTENERS comment for the full two-phase-connect
      # explanation. Left at kafka:9092, /actuator/health would report the
      # kafka health indicator DOWN, which is this ticket's own healthcheck
      # acceptance criterion failing.
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP:-kafka:29092}

  notification-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - KAFKA_BOOTSTRAP=${KAFKA_BOOTSTRAP:-kafka:29092}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-}
      # T047: path to the Firebase service account JSON, mounted into the
      # container (see volumes below) - never the JSON contents inline here.
      # No Hardcoded Config (CLAUDE.md): the one human-edited value lives in
      # .env, same convention as USER_DB_CONNECTION etc.
      - FCM_CREDENTIALS_JSON=${FCM_CREDENTIALS_JSON:-/run/secrets/fcm-service-account.json}
      # T047: kafka:9092 above is the host-tool PLAINTEXT listener (see the
      # user-service block's comment on the same split) - user-service
      # itself is a sibling container, so notification-service must reach it
      # by container name + the port it actually listens on inside the
      # Docker network (8080, not the host-mapped 8081).
      - USER_SERVICE_BASE_URL=${USER_SERVICE_BASE_URL:-http://user-service:8080}
      - SIGNALR_REDIS_CONNECTION=${REDIS_CONNECTION:-redis:6379}
      # T049 (fix cycle 2): Shared secret for calling user-service's internal-only
      # endpoint (GET /users/internal/{id}/fcm-token). This must match the
      # InternalServiceKey configured on user-service — they must agree on a
      # single secret value for inter-service authentication. Defaults to
      # "dev-internal-key-123" for local dev (see .env.example) — in production,
      # this must be a strong, randomly-generated value set via env vars, same
      # as on user-service.
      - InternalServiceKey=${INTERNAL_SERVICE_KEY:-dev-internal-key-123}
    volumes:
      - ${FCM_CREDENTIALS_JSON_HOST_PATH:-./secrets/fcm-service-account.json}:/run/secrets/fcm-service-account.json:ro

  report-service:
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=${REPORT_MONGODB_URI:-mongodb://mongodb:27017/ReportServiceDb}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP:-kafka:9092}

  # T057 fix: SPRING_DATASOURCE_URL (SQL Server) replaced with
  # SPRING_DATA_MONGODB_URI — see docker-compose.yml's admin-service comment
  # and pom.xml's "T057 DATASTORE DECISION" for why. Same shape as
  # report-service's entry above (database name AdminServiceDb, not
  # ReportServiceDb — Database per Service even though both share the one
  # physical Mongo container).
  admin-service:
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=${ADMIN_MONGODB_URI:-mongodb://mongodb:27017/AdminServiceDb}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP:-kafka:9092}
      - USER_SERVICE_BASE_URL=${USER_SERVICE_BASE_URL:-http://user-service:8080}
      - RATING_SERVICE_BASE_URL=${RATING_SERVICE_BASE_URL:-http://rating-service:8080}
      - REPORT_SERVICE_BASE_URL=${REPORT_SERVICE_BASE_URL:-http://report-service:8080}
      # T102: shared secret for User Service's /users/internal/... endpoints
      # (GET /users/internal?accountStatus=suspended, GET /users/internal/{id},
      # PUT /users/internal/{id}/account-status) — must match the
      # InternalServiceKey configured on user-service below, same "one shared
      # secret, every internal caller agrees on it" pattern notification-
      # service's own InternalServiceKey already follows for the fcm-token
      # endpoint.
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-dev-internal-key-123}
