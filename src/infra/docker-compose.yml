# Docker Compose — Infrastructure services (T004) + application service stubs (T001).
# Pattern: Single source of truth for container topology. Each service stub
# can be independently built/started before the full stack is ready.
# No top-level `version:` key — that field is deprecated in Compose v2; the schema
# version is implied by the Compose CLI you run, not declared in the file.

services:

  # ---------------------------------------------------------------------------
  # Infrastructure (T004) — every microservice depends on at least one of these.
  # Ordered roughly by startup dependency: SQL Server before its init job,
  # everything before Kafka UI.
  # ---------------------------------------------------------------------------

  # SQL Server 2022 — one instance hosts many databases; "database per service" is
  # enforced by giving each service a connection string to only its own database,
  # never by SQL Server itself. See ./sql/init-databases.sql for what gets created.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      # Named/typed guard clause via Compose's ${VAR:?message} syntax — fail fast
      # and loud instead of silently booting SQL Server with an empty password.
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:?SA_PASSWORD must be set — copy .env.example to .env and fill in values}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # SQL Server 2022 images ship sqlcmd under mssql-tools18 (requires -C to trust
      # the self-signed dev cert); older images use mssql-tools. Try both so the
      # healthcheck doesn't silently rot if the base image changes tool layout.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot init JOB, not a long-running service — it creates the per-service
  # databases once SQL Server is actually accepting connections, then exits.
  # Healthchecks as dependency gate: `condition: service_healthy` is what stops
  # this from racing the SA login before the server is ready (SQL Server's own
  # entrypoint has no /docker-entrypoint-initdb.d/ equivalent, unlike Postgres/Mongo).
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:?SA_PASSWORD must be set — copy .env.example to .env and fill in values}
    volumes:
      - ./sql/init-databases.sql:/init/init-databases.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -i /init/init-databases.sql
        || /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -i /init/init-databases.sql
    restart: "no"

  # MongoDB 7 — owns Chat (ephemeral messages, TTL-indexed) and Report (escalation
  # queue) data. Collections/indexes for chat_db and report_db are created in T007
  # (mongo-init scripts) — this ticket only stands the server up.
  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      # No Hardcoded Config principle: TTL is a business rule (privacy — how
      # long a chat message may live), not a constant. Read by the T007 init
      # scripts via mongosh's `process.env.MONGO_TTL_SECONDS` (mongosh is a
      # Node.js process, so it inherits whatever env vars Compose passes into
      # this container — no extra plumbing needed). Defaulted with `:-7200`
      # (2 hours) rather than `:?required` because this one has a safe,
      # sensible default unlike a secret such as SA_PASSWORD.
      - MONGO_TTL_SECONDS=${MONGO_TTL_SECONDS:-7200}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      # Mongo (unlike SQL Server) DOES support /docker-entrypoint-initdb.d/, so this
      # mount point is wired now even though the directory is empty until T007 adds
      # its .js/.sh init scripts — no compose changes needed when that ticket lands.
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Kafka (Bitnami) — single broker, dev only, running in KRaft mode.
  #
  # KRaft ("Kafka Raft") replaces Zookeeper as of Kafka 3.5+ (Zookeeper support
  # was removed entirely in Kafka 4.0, which `bitnami/kafka:latest` now tracks) —
  # Kafka manages its own cluster metadata and leader election internally,
  # instead of delegating that job to a separate coordination service. Plain
  # English: earlier Kafka needed a second system just to agree on "who's in
  # charge" the way a company might need an outside notary to certify decisions;
  # KRaft lets Kafka notarize its own decisions. In production this still runs
  # as a quorum of 3-5 nodes voting on metadata (the same Raft consensus idea
  # used elsewhere in distributed systems); here it's shrunk to a single node
  # that is simultaneously the only broker AND the only controller/voter —
  # fine for dev, never for prod.
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      # 29092 is deliberately NOT published to the host — INTERNAL is for
      # container-to-container traffic only (see below). Publishing it would
      # invite host tooling to bootstrap through it and get advertised
      # "kafka:29092" back, which the host can't resolve either.
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      # Pattern: Listener Segregation — three listener *names* on three ports.
      # CONTROLLER (9093) carries KRaft quorum-voting traffic, kept apart from
      # client traffic because Kafka refuses to let them share a listener.
      # PLAINTEXT (9092) and INTERNAL (29092) both carry ordinary client
      # traffic, split by *who* is connecting — see the advertised-listener
      # comment below for why one listener isn't enough here.
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Kafka refuses to guess which listener carries replica-fetch/leader
      # traffic once more than one listener shares the PLAINTEXT protocol —
      # it throws a startup config error unless this is explicit. Doesn't
      # matter functionally on a single-broker dev cluster (there's no other
      # broker to replicate to), but it removes the ambiguity Kafka would
      # otherwise refuse to boot with.
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # The quorum's voter list — "node 0, reachable at kafka:9093" — is how a
      # single broker can also be its own controller. A real prod cluster lists
      # 3-5 voters here instead of one.
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
      # T009 fix for the gotcha flagged in T004: Kafka's client protocol is
      # two-phase — connect to bootstrap.servers, fetch metadata, then
      # reconnect to whatever address that metadata *advertises* for the
      # broker. A single advertised address can't serve both audiences: the
      # HOST machine needs "localhost:9092" (that's the T004 AC — Kafka
      # reachable from a terminal outside Docker); any CONTAINER (Kafka UI,
      # this stack's kafka-init job, and every future producer/consumer)
      # needs an address that resolves *inside* the Docker network, or its
      # second-phase reconnect loops back to itself and every request times
      # out. Two listener names -> two advertised addresses -> both audiences
      # reconnect to something that's actually the broker.
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis 7 — cache-aside store for Discovery Service AND the SignalR backplane
  # for Chat/Notification. One instance, logical separation via DB index (T008).
  # No auth: acceptable only because this never leaves the dev Docker network/localhost.
  redis:
    image: redis:7-alpine
    container_name: redis
    # Mounting the file alone does nothing — the image's default entrypoint
    # (`redis-server`) starts with no arguments and never looks at this path
    # unless told to. The command override is what actually makes Redis boot
    # with our maxmemory/eviction/persistence settings instead of stock
    # defaults. :ro because this container should never rewrite its own config.
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Kafka UI — dev convenience for inspecting topics/messages without a CLI.
  # depends_on + condition: service_healthy again: the UI shouldn't even try to
  # list topics before the broker can answer.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9000:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      # kafka:29092 (INTERNAL listener), not kafka:9092 (PLAINTEXT) — Kafka UI
      # is itself a container, so it needs the listener that advertises a
      # Docker-network-resolvable address. Using kafka:9092 here would satisfy
      # the initial bootstrap connection but then break on the metadata
      # redirect to "localhost:9092", which inside this container is itself —
      # topic/message browsing would silently fail. See the kafka service's
      # KAFKA_CFG_ADVERTISED_LISTENERS comment for the full explanation.
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # One-shot init JOB (T009) — creates the Kafka topics every service's event
  # flow depends on, then exits. Same "job, not a service" shape as
  # sqlserver-init: gated on kafka's healthcheck via depends_on/service_healthy,
  # runs once, restart: "no" so Compose doesn't loop-restart a job that already
  # succeeded.
  kafka-init:
    image: bitnami/kafka:latest
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka-init.sh:/kafka-init.sh:ro
    entrypoint: ["/bin/bash", "/kafka-init.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Application service stubs (T001) — each now gates on the infra it actually
  # needs via depends_on/condition: service_healthy, so `docker compose up`
  # never races a service against a database that isn't accepting connections yet.
  # ---------------------------------------------------------------------------

  # API Gateway (YARP, .NET 9) — single ingress point; validates JWT, routes downstream.
  # API Gateway pattern: cross-cutting concerns handled once, not in every service.
  api-gateway:
    image: shareconnectsave/api-gateway:dev
    build:
      context: ../../src/services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # User Service (.NET 9) — auth, profiles, OTP, identity verification.
  user-service:
    image: shareconnectsave/user-service:dev
    build:
      context: ../../src/services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # No Hardcoded Config: USER_DB_CONNECTION is the one human-edited value
      # in .env (T004); ConnectionStrings__UserDb is the ASP.NET Core-native
      # key name Program.cs and AppDbContextFactory both bind against (T015).
      # Re-pointing this container at a different SQL Server never requires a
      # rebuild — only a different .env value.
      - ConnectionStrings__UserDb=${USER_DB_CONNECTION}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Discovery Service (Java / Spring Boot) — geospatial scan, BLE coordination, filters.
  # Circuit Breaker pattern applied here against User Service calls (T0xx).
  discovery-service:
    image: shareconnectsave/discovery-service:dev
    build:
      context: ../../src/services/discovery-service
      dockerfile: Dockerfile
    container_name: discovery-service
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Connection Service (Java / Spring Boot) — request lifecycle (pending -> accepted -> expired).
  # Saga orchestrator for the connection acceptance flow.
  connection-service:
    image: shareconnectsave/connection-service:dev
    build:
      context: ../../src/services/connection-service
      dockerfile: Dockerfile
    container_name: connection-service
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Chat Service (.NET 9) — MongoDB messages, SignalR hub, TTL expiry.
  chat-service:
    image: shareconnectsave/chat-service:dev
    build:
      context: ../../src/services/chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Rating Service (Java / Spring Boot) — submission, trust score recalculation.
  # Dependency Inversion: TrustScoreCalculator injected as interface, not concrete class.
  rating-service:
    image: shareconnectsave/rating-service:dev
    build:
      context: ../../src/services/rating-service
      dockerfile: Dockerfile
    container_name: rating-service
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Notification Service (.NET 9) — FCM push + SignalR event fan-out.
  notification-service:
    image: shareconnectsave/notification-service:dev
    build:
      context: ../../src/services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8086:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Report Service (Java / Spring Boot) — report queue, escalation, MongoDB.
  report-service:
    image: shareconnectsave/report-service:dev
    build:
      context: ../../src/services/report-service
      dockerfile: Dockerfile
    container_name: report-service
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8087:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Admin Service (Java / Spring Boot) — dashboard, review queue, account actions.
  admin-service:
    image: shareconnectsave/admin-service:dev
    build:
      context: ../../src/services/admin-service
      dockerfile: Dockerfile
    container_name: admin-service
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Named volumes — persist SQL Server / MongoDB data across `docker compose down`
# (but not `down -v`). Named, not bind-mounted: dev data shouldn't live in the repo tree.
volumes:
  sqlserver-data:
  mongodb-data:

# Named network: every service resolves every other by container name (e.g. "kafka:9092")
# because they all land on this one network — pinning its name (instead of letting Compose
# derive "<project>_default") makes that name predictable for anyone inspecting `docker network ls`.
networks:
  default:
    name: shareconnectsave-net
