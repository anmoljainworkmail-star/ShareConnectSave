# redis.conf — Redis configuration for local dev (T008).
#
# Why a config file at all, instead of just `docker run redis`: Redis ships with
# safe-but-wrong-for-us defaults (no memory ceiling, RDB snapshotting enabled).
# Mounting an explicit config file — instead of passing flags on the command line —
# means the *desired* Redis behaviour is version-controlled and reviewable, the same
# reason init-databases.sql and the mongo-init scripts exist as files rather than
# inline shell commands buried in docker-compose.yml.

# ---------------------------------------------------------------------------
# Bounded Resource Management (LRU eviction)
# ---------------------------------------------------------------------------
# Plain English: without a ceiling, a cache is really just a memory leak with
# extra steps — every cached scan result stays forever, and the dev machine
# eventually runs out of RAM. `maxmemory` sets the ceiling; `allkeys-lru` says
# "when full, evict whatever hasn't been touched most recently" (Least Recently
# Used) rather than refusing new writes. This is the same trade-off a phone's
# photo cache makes: old thumbnails get silently evicted to make room for new
# ones, and nobody notices because the ones you actually look at stay cached.
# `noeviction` (the Redis default) is explicitly wrong here — it would start
# rejecting writes once full, which means Discovery Service's cache-aside
# writes would start failing instead of just aging out old entries.
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---------------------------------------------------------------------------
# No persistence (dev only)
# ---------------------------------------------------------------------------
# Plain English: Redis can normally save its data to disk (RDB snapshots and/or
# an append-only log) so a restart doesn't lose everything — durability. We
# deliberately turn that OFF here. Both use cases this Redis instance serves
# (Discovery's scan cache, SignalR's backplane state) are *derived* data — the
# cache can always be rebuilt from SQL Server on the next miss, and backplane
# state is only meaningful while the SignalR connections it describes are
# still open. Persisting either to disk would be doing work to protect data
# that isn't a source of truth in the first place, and would fight the very
# eviction behaviour above (a restored RDB file could reintroduce evicted
# keys). `save ""` disables the RDB snapshot schedule entirely; AOF
# (`appendonly`) is left at its default of `no` for the same reason.
save ""

# ---------------------------------------------------------------------------
# Logical Database Separation
# ---------------------------------------------------------------------------
# Plain English: a single Redis server can host up to 16 independent numbered
# "databases" (0-15) in one process — like one filing cabinet with separate,
# non-overlapping drawers, instead of running a second cabinet (a second Redis
# container) just to keep two kinds of paperwork apart. There is no config
# directive to reserve a database number for a particular service; the
# convention is enforced by callers connecting with the right `SELECT <n>` /
# database index, documented in README.md so nobody has to read code to find
# it:
#   DB 0 -> Discovery Service (nearby-scan cache, cache-aside pattern)
#   DB 1 -> SignalR backplane (Chat + Notification shared connection state)
# `databases 16` is Redis's own default and is listed here only to make the
# separation convention self-documenting next to the comment above, not
# because the value differs from stock Redis.
databases 16
