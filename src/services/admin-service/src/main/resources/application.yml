# application.yml — base (shared) config + dev/prod profile documents below,
# separated by `---`. Same overall shape as report-service's and
# rating-service's application.yml — see those files for the full
# No-Hardcoded-Config rationale (Architecture Rule #3): every value below
# that can vary by environment comes from an env var placeholder, never a
# literal.
#
# T057 supersedes T056's "no datastore block at all" state. See pom.xml's
# "T057 DATASTORE DECISION" comment for the full reasoning — short version:
# a single Mongo collection (admin_outbox) for this service's own Kafka
# outbox rows, reusing the already-running shared Mongo container, instead
# of provisioning a SQL Server schema + Flyway migration for one table.
#
# docker profile intentionally omitted, same precedent as report-service's
# and rating-service's application.yml: only `dev` and `prod` profile
# documents exist below, even though docker-compose.yml sets
# SPRING_PROFILES_ACTIVE=docker on this service — docker-compose.override.yml
# sets SPRING_DATA_MONGODB_URI/SPRING_KAFKA_BOOTSTRAP_SERVERS directly as
# container env vars, which Spring's relaxed env-var binding resolves
# regardless of active profile.
spring:
  application:
    name: admin-service

  # Virtual Threads (Java 21 / Project Loom) — applies to BOTH profiles, so it
  # sits in this shared section rather than inside dev: or prod:. Matters even
  # more here than for a DB-backed service: T057's WebClient calls to
  # User/Rating/Report Service are exactly the kind of blocking-while-waiting-
  # on-I/O work virtual threads are for — a platform thread sits idle holding
  # a request's slot for the entire outbound call; a virtual thread unmounts
  # from its carrier OS thread while blocked, so a burst of slow admin lookups
  # (GET /admin/queue fanning out to Rating/Report Service per suspended user)
  # can't exhaust a fixed-size thread pool.
  threads:
    virtual:
      enabled: true

  kafka:
    # AdminOutboxRelay is this service's first-ever Kafka producer (no
    # consumer exists in admin-service). Same bootstrap-servers property,
    # same ${VAR:default} shape as every other Java service's application.yml.
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    # Spring Boot leaves these null unless set explicitly — it does NOT
    # default to StringSerializer. Without this, AdminOutboxRelay's first
    # real kafkaTemplate.send() throws "Missing required configuration
    # 'key.serializer'", since the outbox payload is already a JSON string
    # and the partition key (userId) is also a plain String.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        # Only health (+ info) reachable over HTTP — never "*". Also the one
        # path SecurityConfig's permitAll() rule carves out of
        # .anyRequest().hasRole("ADMIN") — a health check that itself required
        # X-User-Role would break container orchestration's liveness probe.
        include: health,info
  endpoint:
    health:
      # T057: the userService/ratingService/reportService circuit breakers'
      # CLOSED/OPEN/HALF_OPEN state must be visible on this endpoint, same
      # reasoning as discovery-service's T027. "always" (not "when-authorized")
      # because this service has no anonymous-but-authenticated principal to
      # authorize against on /actuator/health specifically (it is permitAll,
      # not hasRole("ADMIN")) — "when-authorized" would just behave as
      # permanently hidden here. Acceptable because this endpoint is never
      # routed through the public-facing YARP gateway.
      show-details: always
  health:
    circuitbreakers:
      # resilience4j-spring-boot3's own actuator integration: without this,
      # the dependency being on the classpath is not enough to add a
      # "circuitBreakers" component to /actuator/health.
      enabled: true

# Circuit Breaker (Decorator pattern under the hood): one named instance per
# upstream service, matching discovery-service's userService instance shape
# exactly (failure-rate-threshold/sliding-window/minimum-number-of-calls).
# minimum-number-of-calls is pinned explicitly for all three — Resilience4j's
# own default is 100 regardless of sliding-window-size, so a 10-call window
# could never reach it and the breaker would silently never open (the exact
# bug discovery-service's T027 fixed).
resilience4j:
  circuitbreaker:
    instances:
      userService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 10
      ratingService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 10
      reportService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 10
      # T059: admin-service's first circuit breaker around a WRITE call
      # (Connection Service's expire-active) rather than a read-only
      # aggregation fan-out — same failure-rate/sliding-window shape as the
      # other three instances regardless, per this block's own header
      # comment ("one named instance per upstream service").
      connectionService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 10
      # T106: admin-service's first circuit breaker around a call into
      # Discovery Service — same failure-rate/sliding-window shape as every
      # other instance in this block, per this block's own header comment
      # ("one named instance per upstream service").
      discoveryService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 10

# T057 — base URLs for this service's outbound WebClient calls. Port 8080 for
# every one of them (container-internal port), matching discovery-service's
# user-service.base-url comment: container-to-container traffic uses the
# container's own internal port, never the host-side mapping (connection-
# service's own docker-compose.yml entry maps host port 8083 to this same
# container-internal 8080, same as every other Java service here).
user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://user-service:8080}
  # T102: shared secret for User Service's /users/internal/... endpoints —
  # same default ("dev-internal-key-123") notification-service's own
  # InternalServiceKey already uses for local dev, so every internal caller
  # agrees on one value out of the box. In production this must be a strong,
  # randomly-generated value set via INTERNAL_SERVICE_KEY, same as on
  # User Service and notification-service.
  internal-service-key: ${INTERNAL_SERVICE_KEY:dev-internal-key-123}
rating-service:
  base-url: ${RATING_SERVICE_BASE_URL:http://rating-service:8080}
report-service:
  base-url: ${REPORT_SERVICE_BASE_URL:http://report-service:8080}
# T059 — admin-service's first outbound call into Connection Service.
connection-service:
  base-url: ${CONNECTION_SERVICE_BASE_URL:http://connection-service:8080}
# T106 — admin-service's first outbound call into Discovery Service.
discovery-service:
  base-url: ${DISCOVERY_SERVICE_BASE_URL:http://discovery-service:8080}

# T060 — Options pattern (DashboardProperties) backing CacheConfig's Caffeine
# bean. No hardcoded 60 in Java code (Architecture Rule #3): this is the one
# place the dashboard's cache TTL is defined, env-overridable via
# ADMIN_DASHBOARD_CACHE_TTL_SECONDS the same ${VAR:default} shape every other
# value in this file already uses.
admin:
  dashboard:
    cache-ttl-seconds: ${ADMIN_DASHBOARD_CACHE_TTL_SECONDS:60}

---
# dev profile — sensible localhost defaults so a developer can run this
# service directly against docker-up's infra without exporting env vars by
# hand. 27018, not Mongo's default 27017 — same host-port remap reasoning as
# report-service's application.yml (a native Windows MongoDB service can
# already own 27017 on dev machines).
spring:
  config:
    activate:
      on-profile: dev

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27018/AdminServiceDb}

logging:
  level:
    com.shareconnectsave.admin_service: DEBUG

---
# prod profile — deliberately NO default for the Mongo URI or the three
# upstream base URLs' topology-sensitive pieces. A missing env var here must
# fail the container at startup rather than fall back to a dev-shaped guess.
spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}

logging:
  level:
    com.shareconnectsave.admin_service: INFO
